
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT JARVIS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #020817;
  color: #00eaff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.app {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: radial-gradient(circle, #103c5b, #020817 70%);
}

h1 {
  margin-top: 25px;
  font-size: 32px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #00eaff;
}

.subtitle {
  color: #83cddd;
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 4px;
}

.orb {
  width: 220px;
  height: 220px;
  margin: 55px 0 30px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  box-shadow: 0 0 25px #00eaff,
  inset 0 0 30px #00aaff;
  animation: pulse 3s infinite;
}

.orb::before {
  content: "";
  position: absolute;
  width: 175px;
  height: 175px;
  border: 2px solid #00bfff;
  border-radius: 50%;
}

.orb::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  border: 2px dashed #00eaff;
  border-radius: 50%;
  animation: rotate 8s linear infinite;
}

.core {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #00eaff;
  box-shadow: 0 0 40px #00eaff;
  z-index: 1;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.status {
  margin-bottom: 20px;
  font-size: 14px;
  color: #8eefff;
  text-align: center;
}

.output {
  width: 100%;
  min-height: 110px;
  padding: 18px;
  background: #07182b;
  border: 1px solid #087b99;
  border-radius: 12px;
  color: white;
  text-align: center;
  line-height: 1.6;
  margin-bottom: 20px;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

button {
  background: #06283c;
  color: #00eaff;
  border: 1px solid #00eaff;
  border-radius: 30px;
  padding: 14px 20px;
  font-size: 14px;
  box-shadow: 0 0 12px #007b99;
}

button:active {
  background: #00eaff;
  color: #00111c;
}

.language {
  width: 100%;
  margin-top: 25px;
  padding: 13px;
  background: #07182b;
  border: 1px solid #087b99;
  color: white;
  border-radius: 10px;
  font-size: 15px;
}

.footer {
  margin-top: auto;
  padding-top: 35px;
  color: #568b9d;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="app">

<h1>J.A.R.V.I.S</h1>
<p class="subtitle">PERSONAL AI SYSTEM</p>

<div class="orb">
  <div class="core"></div>
</div>

<p class="status" id="status">SYSTEM ONLINE</p>

<div class="output" id="output">
  Hello! I am JARVIS, your personal AI assistant. How can I help you?
</div>

<div class="controls">

<button onclick="startListening()">🎙️ LISTEN</button>

<button onclick="speakReply()">🔊 SPEAK</button>

<button onclick="stopSpeaking()">⏹ STOP</button>

</div>

<select class="language" id="language">
<option value="hi-IN" selected>Hindi Voice Input</option>
<option value="mr-IN">Marathi Voice Input</option>
<option value="en-IN">English Voice Input</option>
</select>

<div class="footer">
PROJECT JARVIS | GEMINI AI VERSION 3.0
</div>

</div>

<script>

// YOUR CLOUDFLARE WORKER URL
const API_URL = "https://jarvis-ai.jdigamabr.workers.dev/";

let currentReply =
"Hello! I am JARVIS, your personal AI assistant.";

function showMessage(message) {
  document.getElementById("output").innerText = message;
}

function setStatus(message) {
  document.getElementById("status").innerText = message;
}

// VOICE RECOGNITION
function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showMessage("Voice recognition is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang =
    document.getElementById("language").value;

  recognition.continuous = false;
  recognition.interimResults = false;

  setStatus("LISTENING...");

  recognition.onresult = function(event) {

    const userText =
      event.results[0][0].transcript;

    showMessage("You said: " + userText);

    askGemini(userText);

  };

  recognition.onerror = function(event) {
    setStatus("VOICE ERROR");
    showMessage("Voice Error: " + event.error);
  };

  recognition.onend = function() {
    if (document.getElementById("status").innerText === "LISTENING...") {
      setStatus("SYSTEM ONLINE");
    }
  };

  try {
    recognition.start();
  } catch(error) {
    showMessage("Please try the microphone again.");
  }
}

// GEMINI AI CONNECTION
async function askGemini(message) {

  setStatus("JARVIS IS THINKING...");
  showMessage("Connecting to Gemini AI...");

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
  const detail =
    data.details?.error?.message ||
    data.details?.message ||
    JSON.stringify(data.details || data);

  throw new Error(detail);
}

    if (!data.reply) {
      throw new Error("No AI response received.");
    }

    currentReply = data.reply;

    showMessage(currentReply);

    setStatus("JARVIS ONLINE");

    speakReply();

  } catch(error) {

    currentReply =
      "Sorry, I could not connect to my AI brain. Please check your internet connection and try again.";

    showMessage(
      "Connection Error: " + error.message
    );

    setStatus("CONNECTION ERROR");

  }
}

// SPEAK AI RESPONSE IN ENGLISH
function speakReply() {

  if (!("speechSynthesis" in window)) {
    showMessage("Voice output is not supported.");
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(currentReply);

  speech.lang = "en-IN";
  speech.rate = 0.95;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

// STOP VOICE
function stopSpeaking() {

  window.speechSynthesis.cancel();

  setStatus("SYSTEM ONLINE");

}

</script>

</body>
</html>
